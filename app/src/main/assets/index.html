<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>힐링</title>
    <link rel="stylesheet" href="css/hub.css">
</head>
<body>
    <main class="app-shell">
        <section class="title-area" aria-label="앱 소개">
            <p class="eyebrow">HEALING MINI GAMES</p>
            <h1>힐링</h1>
            <p class="summary">짧게 들어가서 천천히 둘러보는 미니게임 모음입니다.</p>
        </section>

        <section class="game-grid" aria-label="미니게임 선택">
            <a class="game-card primary" href="games/universe/index.html">
                <span class="card-index">01</span>
                <strong>우리 은하</strong>
                <span>태양계와 가까운 항성계를 자유롭게 탐색합니다.</span>
            </a>

            <a class="game-card water" href="games/water-ripples/index.html">
                <span class="card-index">02</span>
                <strong>물결 명상</strong>
                <span>터치로 물결을 만들며 조용히 쉬어갑니다.</span>
            </a>

            <article class="game-card locked" aria-disabled="true">
                <span class="card-index">03</span>
                <strong>준비 중</strong>
                <span>세 번째 힐링 미니게임 자리입니다.</span>
            </article>
        </section>
    </main>

</html>
